<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>VintWorld</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: barre de rôle en haut, puis vue unique (boutique / artisan / partenaire / admin) dans une colonne centrée de 1120px */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --ink:#1b1d33; --muted:#5d6180; --line:#dfe1ec;
  --indigo:#2f3a8f; --indigo-soft:#e6e8f7; --saffron:#d98a12; --saffron-soft:#fbefd9;
  --ok:#1f7a4d; --ok-soft:#dcf1e5; --warn:#a35c00; --warn-soft:#fbecd5; --bad:#b0303a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131f; --surface:#1c1e2e; --ink:#eceefa; --muted:#a3a7c4; --line:#2e3147;
  --indigo:#9aa6ff; --indigo-soft:#262b4d; --saffron:#f0a93a; --saffron-soft:#3a2c14;
  --ok:#5fd29a; --ok-soft:#173a29; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff7b84; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131f; --surface:#1c1e2e; --ink:#eceefa; --muted:#a3a7c4; --line:#2e3147;
  --indigo:#9aa6ff; --indigo-soft:#262b4d; --saffron:#f0a93a; --saffron-soft:#3a2c14;
  --ok:#5fd29a; --ok-soft:#173a29; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff7b84; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo{background:var(--indigo);color:var(--bg)}
.demo .wrap{padding-block:6px;font-size:13px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.demo b{font-weight:600}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top .wrap{padding-block:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.logo{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;margin-right:auto;background:none;border:0;padding:0}
.logo span{color:var(--saffron)}
.roles{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.roles button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--indigo);color:var(--surface)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px;font-size:13px}
.iconbtn{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px}
.badge{position:absolute;top:-6px;right:-6px;background:var(--saffron);color:#1b1d33;border-radius:999px;font-size:11px;font-weight:600;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
main .wrap{padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,4vw,36px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:500}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--indigo);background:var(--indigo);color:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--indigo)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.accent{background:var(--saffron);border-color:var(--saffron);color:#1b1d33}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--indigo-soft);color:var(--indigo)}
.pill.sun{background:var(--saffron-soft);color:var(--warn)}
/* boutique */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end;margin-bottom:24px}
.hero p{max-width:60ch;margin:8px 0 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.card:hover{border-color:var(--indigo)}
.swatch{aspect-ratio:4/3;max-width:100%;position:relative;display:grid;place-items:center;font-family:var(--f-display);font-size:54px;font-weight:700;color:rgba(255,255,255,.92)}
.swatch small{position:absolute;left:10px;bottom:8px;font-family:var(--f-mono);font-size:11px;font-weight:400;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:5px}
.card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .price{font-family:var(--f-mono);font-weight:500;font-size:16px;margin-top:auto}
.product{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.product .swatch{border-radius:14px;font-size:110px}
.split{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.split .l{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.split .l.total{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:var(--bg);border-radius:10px;padding:10px}
.fact b{display:block;font-family:var(--f-mono);font-size:15px}
.review{border-top:1px solid var(--line);padding-top:10px}
.stars{color:var(--saffron);letter-spacing:2px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;padding:4px}
.bubble{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px}
.bubble.me{align-self:flex-end;background:var(--indigo);color:var(--surface)}
.bubble.them{align-self:flex-start;background:var(--bg)}
input.text,textarea.text,select.text{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.cartline{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:7px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:start}
/* tableaux de bord */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--f-mono);font-size:20px;font-weight:500;margin-top:2px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--saffron)}
.numin{width:80px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 6px;font-family:var(--f-mono)}
.drawer{position:fixed;top:0;right:0;width:min(360px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);z-index:20;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-right:max(20px,env(safe-area-inset-right,0px));overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.15)}
.note{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}
.success{text-align:center;max-width:520px;margin:30px auto}
@media (max-width:820px){
  .hero,.product,.two{grid-template-columns:1fr}
  .filters{justify-content:flex-start}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:460px){.facts{grid-template-columns:1fr 1fr}.logo{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="demo"><div class="wrap"><span id="demoTxt"></span><span id="clock" class="mono"></span></div></div>
<header class="top"><div class="wrap">
  <button class="logo" data-a="home" aria-label="VintWorld">Vint<span>World</span></button>

    <button class="iconbtn" data-a="notifs" id="bell"></button>
    <button class="iconbtn" data-a="cart" id="cartBtn"></button>
  </div>
</div></header>
<main><div class="wrap" id="app"></div></main>
<div id="layer"></div>

function rates(aid){
  const today=new Date(BASE);today.setDate(today.getDate()+S.today);
  let ps=S.partners.flatMap(p=>p.links.filter(l=>l.a===aid&&new Date(l.until)>=today).map(()=>({id:p.id,name:p.name,rate:p.rate})));
  const sum=ps.reduce((s,p)=>s+p.rate,0), room=Math.max(0,S.settings.cap-S.settings.platform);
  if(sum>room&&sum>0) ps=ps.map(p=>({...p,rate:p.rate*room/sum}));
  return {platform:S.settings.platform,partners:ps,total:S.settings.platform+ps.reduce((s,p)=>s+p.rate,0)};
}

function payState(o,paid){

  const tot=rows.reduce((s,r)=>s+conv(r.x.amt,A(r.o.a).cur,"EUR"),0);
  return `<p class="eyebrow">${t("partner")}</p><h1>${esc(p.name)}</h1>
  <div class="kpis" style="margin:18px 0;grid-template-columns:repeat(3,1fr)"><div class="kpi"><span class="muted">${t("commission")}</span><b>${(p.rate*100).toFixed(0)} %</b></div><div class="kpi"><span class="muted">${t("linked")}</span><b>${p.links.length}</b></div><div class="kpi"><span class="muted">${t("earnings")}</span><b>${show(tot,"EUR")}</b></div></div>
  <div class="two"><section class="panel stack"><h2>${t("earnings")}</h2><div class="tablewrap"><table><thead><tr><th>${t("order")}</th><th>${t("artisan")}</th><th class="num">${t("amount")}</th><th>${t("status")}</th></tr></thead><tbody>
  ${rows.map(({o,x})=>{const s=payState(o,x.paid);return `<tr><td class="mono">${o.id}</td><td>${esc(A(o.a).shop)}</td><td class="num">${fmt(x.amt,A(o.a).cur)}</td><td><span class="pill ${s.k}">${s.l}</span></td></tr>`}).join("")||`<tr><td colspan="4" class="muted">${t("none")}</td></tr>`}</tbody></table></div></section>
  <section class="panel stack"><h2>${t("myArtisans")}</h2>${p.links.map(l=>{const a=A(l.a);return `<div class="row" style="justify-content:space-between"><div><b>${esc(a.shop)}</b><br><span class="muted" style="font-size:13px">${esc(a.city)}</span></div><span class="pill info">${t("until")} ${new Date(l.until).toLocaleDateString(LOC[S.lang])}</span></div>`}).join("")}</section></div>`;
}

function viewAdmin(){
  const st=S.settings,pend=S.artisans.filter(a=>!a.ok);
  const gmv=S.orders.reduce((s,o)=>s+conv(o.total,A(o.a).cur,"EUR"),0),rev=S.orders.reduce((s,o)=>s+conv(o.platform,A(o.a).cur,"EUR"),0);
  const lines=S.orders.flatMap(o=>{const a=A(o.a);return [{o,who:a.shop,kind:t("artisan"),amt:o.base+o.ship,cur:a.cur,paid:o.paidA,key:"A"},...o.partners.map((x,i)=>({o,who:x.name,kind:t("partner"),amt:x.amt,cur:a.cur,paid:x.paid,key:i}))]});
  const owed=lines.filter(l=>!l.paid).reduce((s,l)=>s+conv(l.amt,l.cur,"EUR"),0);
  const tabs=[["pay",t("payouts")],["val",t("pending")+` (${pend.length})`],["set",t("settings")]];
  let body="";
  if(S.adminTab==="pay") body=`<div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="muted" style="font-size:13px">${t("delay")} : ${st.delay}</span><button class="btn ghost small" data-a="sim">${t("sim")}</button></div>
   <div class="tablewrap"><table><thead><tr><th>${t("order")}</th><th>${t("beneficiary")}</th><th>${t("status")}</th><th class="num">${t("amount")}</th><th>${t("status")}</th><th></th></tr></thead><tbody>
   ${lines.slice().reverse().map(l=>{const s=payState(l.o,l.paid);return `<tr><td class="mono">${l.o.id}</td><td>${esc(l.who)}<br><span class="muted" style="font-size:12px">${l.kind}</span></td><td>${statusPill(l.o.status)}</td><td class="num">${fmt(l.amt,l.cur)}</td><td><span class="pill ${s.k}">${s.l}</span></td><td>${s.pay?`<button class="btn small" data-a="markpaid" data-v="${l.o.id}" data-k="${l.key}">${t("markPaid")}</button>`:""}</td></tr>`}).join("")}</tbody></table></div>`;
  if(S.adminTab==="val") body=`<p class="muted">${t("pendingNote")}</p>`+(pend.map(a=>`<div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding:12px 0"><div><b>${esc(a.shop)}</b> · ${esc(a.name)}<br><span class="muted" style="font-size:13px">${esc(a.city)} · ${a.cur} · ${dayStr(a.applied)}</span></div><div class="row"><button class="btn small" data-a="validate" data-v="${a.id}">${t("validate")}</button><button class="btn ghost small" data-a="reject" data-v="${a.id}">${t("reject")}</button></div></div>`).join("")||`<p>${t("none")}</p>`);
  if(S.adminTab==="set") body=`<div class="stack">
   <div class="row" style="justify-content:space-between"><label for="setPf">${t("platformRate")}</label><span><input class="numin" type="number" min="0" max="50" step="1" id="setPf" data-a="set" data-k="platform" value="${Math.round(st.platform*100)}"> %</span></div>
   <div class="row" style="justify-content:space-between"><label for="setCap">${t("cap")}</label><span><input class="numin" type="number" min="0" max="80" step="1" id="setCap" data-a="set" data-k="cap" value="${Math.round(st.cap*100)}"> %</span></div>
   <p class="muted" style="font-size:13px;margin:0">${t("capNote")}</p>
   <div class="row" style="justify-content:space-between"><label for="setDl">${t("delay")}</label><input class="numin" type="number" min="0" max="90" id="setDl" data-a="set" data-k="delay" value="${st.delay}"></div>
   <h3 style="margin-top:8px">${t("partners")}</h3>
   <div class="tablewrap"><table><thead><tr><th>${t("partner")}</th><th>${t("rate")}</th><th>${t("linked")}</th></tr></thead><tbody>${S.partners.map(p=>`<tr><td>${esc(p.name)}</td><td><input class="numin" type="number" min="0" max="30" step=".5" id="pr-${p.id}" data-a="prate" data-v="${p.id}" value="${p.rate*100}"> %</td><td>${p.links.map(l=>`${esc(A(l.a).shop)} <span class="muted">→ ${new Date(l.until).toLocaleDateString(LOC[S.lang])}</span>`).join("<br>")}</td></tr>`).join("")}</tbody></table></div>
   ${splitBox(P("x1"))}</div>`;
  return `<p class="eyebrow">${t("admin")}</p><h1>VintWorld</h1>
  <div class="kpis" style="margin:18px 0"><div class="kpi"><span class="muted">${t("orders")}</span><b>${S.orders.length}</b></div><div class="kpi"><span class="muted">${t("gmv")}</span><b>${show(gmv,"EUR")}</b></div><div class="kpi"><span class="muted">${t("revenue")}</span><b>${show(rev,"EUR")}</b></div><div class="kpi"><span class="muted">${t("toPay")}</span><b>${show(owed,"EUR")}</b></div></div>
  <section class="panel"><div class="tabs">${tabs.map(([k,l])=>`<button data-a="adminTab" data-v="${k}" aria-pressed="${S.adminTab===k}">${l}</button>`).join("")}</div>${body}</section>`;
}

function renderLayer(){
  const L=document.getElementById("layer");let h="";
  if(S.drawer==="notifs"){const ns=S.notifs.filter(x=>x.role===S.role).slice().reverse();
    h+=`<aside class="drawer" aria-label="${t("notifs")}"><div class="row" style="justify-content:space-between"><h2>${t("notifs")}</h2><button class="btn ghost small" data-a="close">${t("close")}</button></div>${ns.map(n=>`<div class="note">${esc(n.t)}<br><span class="muted" style="font-size:12px">${dayStr(n.d)}</span></div>`).join("")||`<p class="muted">${t("noNotif")}</p>`}</aside>`;}
  if(S.toast) h+=`<div class="toast" role="status">${esc(S.toast)}</div>`;
  L.innerHTML=h;
}
let toastTimer;
function toast(m){S.toast=m;renderLayer();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{S.toast=null;renderLayer()},2200)}
const notify=(role,txt)=>S.notifs.push({role,t:txt,d:S.today});

// ---------- Actions ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT"||b.tagName==="SELECT")return;
  const a=b.dataset.a,v=b.dataset.v;
  switch(a){
    case"home":S.view={name:"shop"};if(S.role!=="client")S.role="client";break;
    case"role":S.role=v;S.view={name:"shop"};S.drawer=null;break;
    case"filter":S.filter=v;break;
    case"open":S.view={name:"product",id:v};window.scrollTo(0,0);break;
    case"cart":S.view={name:"cart"};break;
    case"add":{const l=S.cart.find(x=>x.p===v);l?l.q++:S.cart.push({p:v,q:1});toast(t("added"));break}
    case"qty":{const l=S.cart.find(x=>x.p===v);l.q+=+b.dataset.d;if(l.q<=0)S.cart=S.cart.filter(x=>x!==l);break}
    case"pay":{const g=cartGroups();Object.entries(g).forEach(([aid,ls])=>{const o=mkOrder(aid,ls.map(l=>({p:l.p,q:l.q})),S.zone,S.today,"paid");S.orders.push(o);
      ls.forEach(l=>{const p=P(l.p);p.stock=Math.max(0,p.stock-l.q)});notify("artisan",`${o.id} · ${t("newOrder")}`);notify("admin",`${o.id} · ${t("newOrder")} · ${fmt(o.total,A(aid).cur)}`);
      o.partners.forEach(x=>notify("partner",`${o.id} · ${t("commission")} ${fmt(x.amt,A(aid).cur)}`))});
      S.cart=[];S.view={name:"ok"};break}
    case"ship":{const o=S.orders.find(x=>x.id===v);o.status="shipped";notify("client",`${o.id} · ${t("shipped")}`);break}
    case"deliver":{const o=S.orders.find(x=>x.id===v);o.status="delivered";o.delivered=S.today;break}
    case"artTab":S.artTab=v;break;
    case"adminTab":S.adminTab=v;break;
    case"sim":S.today+=7;break;
    case"validate":A(v).ok=true;toast(t("validated"));break;
    case"reject":S.artisans=S.artisans.filter(x=>x.id!==v);break;
    case"markpaid":{const o=S.orders.find(x=>x.id===v),k=b.dataset.k;k==="A"?o.paidA=true:o.partners[+k].paid=true;toast(t("paidT"));break}
    case"notifs":S.drawer=S.drawer?null:"notifs";S.notifs.forEach(n=>{if(n.role===S.role)n.read=true});break;
    case"close":S.drawer=null;break;
    default:return;
  }
  render();
});
document.addEventListener("change",e=>{
  const el=e.target,a=el.dataset.a;
  if(el.id==="lang"){S.lang=el.value;return render()}
  if(el.id==="cur"){S.cur=el.value;return render()}
  if(a==="zone"){S.zone=el.value;return render()}
  if(a==="edit"){const p=P(el.dataset.v),k=el.dataset.k;p[k]=k==="mto"?el.checked:Math.max(0,+el.value||0);toast(t("saved"));return render()}
  if(a==="set"){const k=el.dataset.k,n=Math.max(0,+el.value||0);S.settings[k]=k==="delay"?n:n/100;toast(t("saved"));return render()}
  if(a==="prate"){S.partners.find(p=>p.id===el.dataset.v).rate=Math.max(0,+el.value||0)/100;toast(t("saved"));return render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,txt=(f.t?.value||"").trim();if(!txt)return;
  if(f.dataset.f==="msg"){S.threads[f.dataset.v].push({me:true,t:txt});notify("artisan",`${t("newMsg")} · ${txt.slice(0,40)}`);toast(t("sent"))}
  if(f.dataset.f==="reply"){S.threads[f.dataset.v].push({me:false,t:txt});notify("client",`${t("newMsg")} · ${txt.slice(0,40)}`);toast(t("sent"))}
  if(f.dataset.f==="review"){(S.reviews[f.dataset.v]=S.reviews[f.dataset.v]||[]).push({who:t("client"),n:+f.n.value,t:txt})}
  render();
});
render();
</script>
<style>.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>

</body>
</html>
